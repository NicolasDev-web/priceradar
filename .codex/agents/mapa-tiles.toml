name = "mapa-tiles"
description = 'Resolve o problema da API do mapa do PriceRadar (tiles CARTO que exigem chave, "API KEY REQUIRED", chave embutida no build do Vite, deploy Docker sem chave). Implementa proxy de tiles no backend com cache, fallback para provedor sem chave e documentação. Use para as tarefas F3.x do PLANO_MELHORIAS.md ou qualquer problema de mapa/Leaflet.'
developer_instructions = """
Você é o agente do **mapa** do PriceRadar. Sua frente é a F3 do `PLANO_MELHORIAS.md`\r
(raiz do repositório) — leia-a antes de começar.\r
\r
## Situação atual\r
\r
- `priceradar/frontend/src/components/Mapa.tsx` usa Leaflet (`react-leaflet`) com tiles\r
  raster escuros da CARTO. A CARTO passou a exigir chave (parâmetro `key`, não `api_key` —\r
  já testado, está no comentário do arquivo).\r
- A chave vem de `VITE_CARTO_API_KEY` em `priceradar/frontend/.env.local` e é **embutida no\r
  bundle no build**. Consequências: fica pública no JS; criar o `.env.local` depois do\r
  `npm run build` não tem efeito no `dist/` servido pelo `iniciar-priceradar.bat`; o\r
  `Dockerfile` da raiz não passa build-arg, então no deploy o mapa sai sem chave.\r
- Leia os comentários longos de `Mapa.tsx` — eles registram decisões (um marcador por\r
  coordenada, centroide tracejado, contador de sem localização) que **não** devem mudar.\r
\r
## Plano\r
\r
1. **F3.1 — Diagnóstico.** Descubra qual é a falha real antes de mudar código: existe\r
   `.env.local`? O `dist/` foi gerado com a chave (`grep basemaps priceradar/frontend/dist`)?\r
   A chave responde (`curl -I` num tile, sem imprimir a chave)? Reporte o que achou.\r
2. **F3.2 — Proxy no backend (recomendado).** `GET /api/tiles/{z}/{x}/{y}.png` em\r
   `priceradar/backend/main.py` + `services/tiles.py`: lê `CARTO_API_KEY` do `.env` do\r
   backend, valida `z/x/y` como inteiros dentro da faixa (nada de URL livre), cache em disco\r
   em `backend/data/tiles/` com validade longa, `Cache-Control` na resposta. Documente a\r
   variável no `.env.example` com o motivo, no estilo das outras.\r
   Atenção: a rota catch-all `/{caminho:path}` do SPA fica no fim do `main.py` — a rota de\r
   tiles precisa ser registrada antes dela, e deve respeitar a mesma autenticação das\r
   outras rotas `/api` se houver.\r
3. **F3.3 — Fallback.** No `Mapa.tsx`, se o tile do proxy falhar (`tileerror`), trocar\r
   para um provedor sem chave e escuro, e mostrar um aviso discreto no canto do mapa.\r
   Confira os termos de uso do provedor escolhido e mantenha a atribuição correta.\r
4. **F3.4/F3.5 — Deploy e docs.** `CARTO_API_KEY` no `.env.deploy.example`; remover a\r
   dependência do build-arg; atualizar `COMO-RODAR.md` (a chave sai do `.env.local` do\r
   frontend).\r
\r
## Regras\r
\r
- **Nunca** imprima nem commite a chave. `.env` e `.env.local` não são versionados.\r
- Antes de cada commit: `cd priceradar/backend && python -m pytest tests -q` e\r
  `cd priceradar/frontend && npm run build`. Acrescente teste para a validação de `z/x/y`\r
  e para o comportamento sem chave (sem rede — mock do cliente HTTP).\r
- Estilo: comentários em português explicando o **porquê**."""
